name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The real commands live in the Makefile so CI runs exactly what a
# contributor runs locally. One build job per supported board.
jobs:
  build:
    name: Build firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [c6, s3]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: arduino/setup-arduino-cli@v2

      # The ESP32 core is several hundred MB; without a cache every run would
      # spend most of its time downloading. The key follows the Makefile
      # because that is where the versions are pinned.
      - name: Cache core and libraries
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install core and libraries
        run: make deps

      # Generated files are committed; fail if someone edited them by hand or
      # forgot to regenerate after touching the sources. The same target runs
      # tools/check_consistency.mjs so the device menu, species and action
      # types cannot drift between the firmware, the web panel, the landing
      # simulator and the MCP server.
      - name: Check generated assets, manifest and cross-component consistency
        run: make check

      - name: Compile
        run: make build

      # boot_app0.bin is not produced by the compiler: it ships with the core.
      # The web installer needs it as the third part.
      - name: Add boot_app0.bin
        run: make bootapp0

      # Rename to the per-board names the manifest and the release use.
      - name: Collect binaries
        run: |
          d=$(make --no-print-directory print-build)
          mkdir -p dist
          cp "$d/espgotchi.ino.bin"            dist/espgotchi-$BOARD.bin
          cp "$d/espgotchi.ino.merged.bin"     dist/espgotchi-$BOARD.merged.bin
          cp "$d/espgotchi.ino.bootloader.bin" dist/bootloader-$BOARD.bin
          cp "$d/espgotchi.ino.partitions.bin" dist/partitions-$BOARD.bin
          cp "$d/boot_app0.bin"                dist/boot_app0-$BOARD.bin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/espgotchi-c6.bin dist/espgotchi-c6.merged.bin \
            dist/espgotchi-s3.bin dist/espgotchi-s3.merged.bin

  pages:
    name: Deploy web installer
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      # Binaries never live in the repo: the site is assembled here with the
      # names the manifest expects, so the published page can never lag
      # behind the firmware.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/index.html docs/manifest.json docs/robots.txt docs/sitemap.xml _site/
          cp shared/sprites.json _site/sprites.json
          node tools/gen_og.mjs _site/og.png
          for b in c6 s3; do
            cp dist/espgotchi-$b.bin dist/bootloader-$b.bin dist/partitions-$b.bin dist/boot_app0-$b.bin _site/
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
