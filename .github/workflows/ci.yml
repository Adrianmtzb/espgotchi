name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The real commands live in the Makefile so CI runs exactly what a
# contributor runs locally.
env:
  BUILD_DIR: firmware/espgotchi/build/esp32.esp32.esp32c6

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: arduino/setup-arduino-cli@v2

      # The ESP32 core is several hundred MB; without a cache every run would
      # spend most of its time downloading. The key follows the Makefile
      # because that is where the versions are pinned.
      - name: Cache core and libraries
        uses: actions/cache@v6
        with:
          path: ~/.arduino15
          key: arduino-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install core and libraries
        run: make deps

      # Generated files are committed; fail if someone edited them by hand or
      # forgot to regenerate after touching the sources.
      - name: Check generated assets and manifest
        run: make check

      - name: Compile
        run: make build

      # boot_app0.bin is not produced by the compiler: it ships with the core.
      # The web installer needs it as the third part.
      - name: Add boot_app0.bin
        run: make bootapp0

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.BUILD_DIR }}/*.bin
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/espgotchi.ino.bin \
            dist/espgotchi.ino.merged.bin

  pages:
    name: Deploy web installer
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      # Binaries never live in the repo: the site is assembled here with the
      # names the manifest expects, so the published page can never lag
      # behind the firmware.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/index.html docs/manifest.json _site/
          cp shared/sprites.json                 _site/sprites.json
          cp dist/espgotchi.ino.bin              _site/espgotchi.bin
          cp dist/espgotchi.ino.bootloader.bin   _site/bootloader.bin
          cp dist/espgotchi.ino.partitions.bin   _site/partitions.bin
          cp dist/boot_app0.bin                  _site/boot_app0.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
