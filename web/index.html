<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ESPgotchi</title>
<style>
  :root{
    --accent:#ff5c8a;--accent-ink:#1a1a2e;
    --bg:#0e1020;--bg2:#171a33;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);
    --fg:#eef0ff;--muted:#9aa0c9;--good:#4fd27a;--warn:#ffd166;--bad:#ff5c7a;
    --room:#fff1f3;--room2:#ffd6e0;--radius:20px;
  }
  @media (prefers-color-scheme: light){:root{--bg:#f4f2ec;--bg2:#e9e6dc;--panel:rgba(255,255,255,.75);--line:rgba(0,0,0,.06);--fg:#1b1d33;--muted:#6b7090}}
  *{box-sizing:border-box}
  html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button,canvas,input{touch-action:manipulation}
  .seg{display:flex;gap:4px;background:color-mix(in srgb,var(--fg) 6%,transparent);padding:4px;border-radius:12px;flex:1;min-width:220px}
  .seg button{flex:1;padding:9px 6px;border:0;background:transparent;font-size:13px;border-radius:9px}
  .seg button.active{background:var(--accent);color:var(--accent-ink)}
  .evo{font-size:12px;color:var(--muted);margin-top:10px;padding:0 4px}
  html,body{height:100%}
  body{margin:0;color:var(--fg);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 35%,transparent),transparent 60%),
               radial-gradient(900px 500px at 110% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),var(--bg);
    display:flex;justify-content:center;padding:18px 16px 40px;transition:background .6s}
  main{width:100%;max-width:760px;display:grid;gap:16px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 4px 0}
  header h1{margin:0;font-size:30px;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
  header h1 .emoji{font-size:26px}
  header .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .badges{display:flex;gap:8px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(8px)}
  .badge.on{color:var(--good)} .badge.off{color:var(--bad)} .badge.mood{color:var(--fg)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.18)}
  .hero{padding:12px}
  #screen{width:100%;aspect-ratio:320/172;image-rendering:pixelated;border-radius:14px;display:block;background:var(--room)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px;margin-top:14px;padding:0 4px}
  .stat label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;letter-spacing:.3px}
  .stat label b{color:var(--fg);font-variant-numeric:tabular-nums}
  .bar{height:8px;border-radius:6px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--good);border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1),background .4s}
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
  button{border:1px solid var(--line);border-radius:14px;padding:14px 10px;font:inherit;font-weight:600;background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg);cursor:pointer;transition:transform .08s,background .2s,border-color .2s}
  button:hover{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)} button:active{transform:scale(.96)}
  button:disabled{opacity:.35;cursor:not-allowed;transform:none;background:transparent;border-color:var(--line)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button.danger:hover{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}
  button .ico{display:block;font-size:22px;margin-bottom:4px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text],input[type=password],select{flex:1;min-width:140px;padding:12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg);font:inherit}
  select{appearance:auto;max-width:100%}
  input[type=range]{flex:1;accent-color:var(--accent)}
  h2{margin:0 0 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:700}
  ul#log{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;font-size:13px}
  ul#log li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
  ul#log li time{color:var(--muted);flex:0 0 48px;font-variant-numeric:tabular-nums}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin-top:10px}
  .kv b{color:var(--muted);font-weight:500}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%)}
  dialog{border:0;border-radius:24px;padding:22px;background:var(--bg2);color:var(--fg);width:min(94vw,560px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
  dialog h3{margin:0 0 4px;font-size:22px} dialog p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .species{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .species button{display:grid;gap:6px;justify-items:center;padding:14px 8px}
  .species canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:12px}
  .species small{color:var(--muted);font-weight:500}
  .species .season{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#ff8c1a;color:#1a0f1f}
  .dlg-foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1><span class="emoji" id="emoji">🥚</span><span id="name">ESPgotchi</span></h1>
      <div class="sub" id="stage">connecting to your pet…</div>
    </div>
    <div class="badges"><span class="badge mood" id="mood">…</span><span class="badge" id="conn">offline</span></div>
  </header>

  <section class="card hero">
    <canvas id="screen" width="320" height="172"></canvas>
    <div class="stats">
      <div class="stat"><label>Food <b id="v-hunger"></b></label><div class="bar"><i id="b-hunger"></i></div></div>
      <div class="stat"><label>Fun <b id="v-happiness"></b></label><div class="bar"><i id="b-happiness"></i></div></div>
      <div class="stat"><label>Energy <b id="v-energy"></b></label><div class="bar"><i id="b-energy"></i></div></div>
      <div class="stat"><label>Clean <b id="v-hygiene"></b></label><div class="bar"><i id="b-hygiene"></i></div></div>
      <div class="stat"><label>Health <b id="v-health"></b></label><div class="bar"><i id="b-health"></i></div></div>
      <div class="stat"><label>Weight <b id="v-weight"></b></label><div class="bar"><i id="b-weight"></i></div></div>
    </div>
    <div class="evo" id="evo"></div>
  </section>

  <section class="card">
    <h2>Care</h2>
    <div class="actions" id="actions">
      <button data-action="feed"><span class="ico">🍔</span>Feed</button>
      <button data-action="snack"><span class="ico">🍬</span>Snack</button>
      <button data-action="play"><span class="ico">⚽</span>Play</button>
      <button data-action="pet"><span class="ico">💗</span>Pet</button>
      <button data-action="clean"><span class="ico">🧼</span>Clean</button>
      <button data-action="sleep" id="btn-sleep"><span class="ico">🌙</span>Lights off</button>
      <button data-action="medicine"><span class="ico">💊</span>Medicine</button>
      <button data-action="hatch" id="btn-hatch" class="primary" hidden><span class="ico">🐣</span>Hatch now</button>
      <button id="btn-reset" class="danger"><span class="ico">✨</span>New egg</button>
    </div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <ul id="log"></ul>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <form class="row" id="f-name" autocomplete="off"><input type="text" id="i-name" maxlength="15" placeholder="Pet name"><button>Rename</button></form>
    <div class="row" style="margin-top:12px"><label style="font-size:13px;color:var(--muted)">Screen brightness</label><input type="range" id="i-bl" min="5" max="255"><b id="v-bl" style="font-size:13px;min-width:28px;text-align:right"></b></div>
    <label class="row" style="margin-top:8px;font-size:13px;color:var(--muted);gap:8px"><input type="checkbox" id="i-ndim"> Dim the screen at night (22:00–07:00)</label>
    <div class="row" style="margin-top:12px"><label style="font-size:13px;color:var(--muted)">Screen orientation</label>
      <div class="seg" id="seg-orient">
        <button data-orient="landscape">Landscape</button><button data-orient="landscape-flipped">Landscape ↻</button>
        <button data-orient="portrait">Portrait</button><button data-orient="portrait-flipped">Portrait ↻</button>
      </div></div>
    <form class="row" id="f-tz" style="margin-top:12px"><label style="font-size:13px;color:var(--muted)">Time zone</label><select id="s-tz"></select><input type="text" id="i-tz" placeholder="POSIX TZ, e.g. CET-1CEST,M3.5.0,M10.5.0/3" hidden><button>Set time zone</button></form>
    <form class="row" id="f-host" style="margin-top:12px" autocomplete="off"><input type="text" id="i-host" maxlength="24" pattern="[a-z0-9-]+" placeholder="Hostname, e.g. espgotchi (→ espgotchi.local)"><button>Set hostname</button></form>
    <details style="margin-top:14px">
      <summary>Device & WiFi</summary>
      <div class="kv" id="devinfo"></div>
      <form class="row" id="f-wifi" style="margin-top:12px"><input type="text" id="i-ssid" name="network" placeholder="WiFi SSID" required autocomplete="off"><input type="password" id="i-pass" placeholder="Password" autocomplete="new-password"><button class="danger">Save & reboot</button></form>
    </details>
  </section>
</main>

<dialog id="dlg">
  <h3>Choose a new companion</h3>
  <p>The current pet will be replaced by a fresh egg. Each species has its own look and colors.</p>
  <div class="species" id="species"></div>
  <div class="dlg-foot"><button id="dlg-cancel">Cancel</button><button class="primary" data-species="">🎲 Surprise me</button></div>
</dialog>
<div id="toast"></div>

<script>
// Served by the device: API calls are relative. For local dev: index.html?host=<device-ip>
const HOST = new URLSearchParams(location.search).get('host');
const API = HOST ? `http://${HOST}` : '';
const $ = (id) => document.getElementById(id);
const PAL = { '#': 0, o: 1, x: 2 };

let sheet = null, state = null, lastAction = null, lastActionAt = 0, localItem = null, animSeenAt = 0, frame = 0, connected = false, themed = '';

async function api(path, body) {
  const res = await fetch(API + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); }
function fmtAge(sec) { if (sec < 3600) return `${Math.floor(sec / 60)} min`; const h = Math.floor(sec / 3600); return h < 48 ? `${h} h` : `${Math.floor(h / 24)} days`; }
function fmtTime(t) { if (t > 1700000000) return new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); return `+${Math.floor(t / 60)}m`; }
function barColor(v) { return v > 50 ? 'var(--good)' : v > 25 ? 'var(--warn)' : 'var(--bad)'; }
function setBar(key, v, max = 100) {
  $('v-' + key).textContent = v;
  const el = $('b-' + key);
  el.style.width = Math.min(100, v * 100 / max) + '%';
  el.style.background = key === 'weight' ? 'var(--accent)' : barColor(v);
}

// ---- sprites ----
function sleepyRows(rows, eyeIdx) {
  const n = rows.length;
  const g = rows.map(r => [...r].map(c => (c === "." ? -1 : +c)));
  const isEye = (r, c) => r >= 0 && c >= 0 && r < n && c < n && eyeIdx.includes(g[r][c]);
  const seen = rows.map(() => Array(n).fill(false));
  for (let r0 = 0; r0 < n; r0++) for (let c0 = 0; c0 < n; c0++) {
    if (seen[r0][c0] || !isEye(r0, c0)) continue;
    const blob = [], st = [[r0, c0]];
    seen[r0][c0] = true;
    while (st.length) {
      const [r, c] = st.pop(); blob.push([r, c]);
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const rr = r + dr, cc = c + dc;
        if (isEye(rr, cc) && !seen[rr][cc]) { seen[rr][cc] = true; st.push([rr, cc]); }
      }
    }
    const rs = blob.map(b => b[0]), cs = blob.map(b => b[1]);
    const top = Math.min(...rs), bot = Math.max(...rs), left = Math.min(...cs), right = Math.max(...cs);
    if (bot === top && right - left >= 3) continue;  // a wide 1px strip is a mouth/teeth, not an eye
    // skin = most common non-eye, non-outline color touching the blob
    const cnt = {};
    for (const [r, c] of blob) for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const rr = r + dr, cc = c + dc;
      if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
      const v = g[rr][cc];
      if (v > 0 && !eyeIdx.includes(v)) cnt[v] = (cnt[v] || 0) + 1;
    }
    const skin = +Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0] || 1;
    for (const [r, c] of blob) g[r][c] = r === bot ? 0 : skin;
  }
  return g.map(row => row.map(v => (v < 0 ? "." : String(v))).join(""));
}
const sleepCache = {};
function resolveSprite(name) {
  if (name.endsWith('_sleep') && !sheet.sprites[name]) {
    if (!sleepCache[name]) {
      const base = resolveSprite(name.replace(/_sleep$/, '_0')); if (!base) return null;
      const sp = sheet.species[name.split('_')[0]] || {};
      sleepCache[name] = { rows: sleepyRows(base.rows, sp.eyes || [4, 5]), palette: base.palette };
    }
    return sleepCache[name];
  }
  const s = sheet.sprites[name]; if (!s) return null;
  if (s.rows) return s;
  const base = resolveSprite(s.base);
  const rows = [...base.rows]; for (const [k, v] of Object.entries(s.patch)) rows[+k] = v;
  return { rows, palette: s.palette || base.palette };
}
function drawSprite(ctx, name, x, y, scale, maxCols = 99) {
  const s = sheet && resolveSprite(name); if (!s) return;
  const n = s.rows.length;
  for (let r = 0; r < n; r++) for (let c = 0; c < n && c < maxCols; c++) {
    const ch = s.rows[r][c]; if (ch === '.') continue;
    ctx.fillStyle = s.palette[ch in PAL ? PAL[ch] : +ch];
    ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
  }
}

function applyTheme(species) {
  if (!sheet || themed === species) return;
  const t = sheet.species[species]; if (!t) return;
  themed = species;
  const r = document.documentElement.style;
  r.setProperty('--accent', t.accent); r.setProperty('--room', t.bg); r.setProperty('--room2', t.bg2);
  $('emoji').textContent = t.emoji;
}

function render(pet) {
  applyTheme(pet.species);
  $('name').textContent = pet.name;
  const sp = sheet?.species[pet.species]?.label || pet.species;
  const form = pet.stage === 'adult' && pet.form && pet.form !== 'normal' ? `${pet.form} ` : '';
  $('stage').textContent = pet.stage === 'egg' ? `${sp} egg · hatching in ${Math.max(0, pet.nextEvolutionSec ?? 0)} s` : `${sp} · ${form}${pet.stage} · ${fmtAge(pet.ageSec)} old · generation ${pet.generation}`;
  const STAGES = ['egg', 'baby', 'child', 'teen', 'adult', 'elder'];
  const idx = STAGES.indexOf(pet.stage);
  const path = STAGES.map((st, i) => i < idx ? `<s style="opacity:.5">${st}</s>` : i === idx ? `<b style="color:var(--fg)">${st}</b>` : st).join(' › ');
  const nxt = pet.nextEvolutionSec;
  $('evo').innerHTML = pet.dead ? '' : `${path}${nxt ? ` · next in ${fmtAge(nxt)}` : ''}${idx >= 4 ? ` · form: <b>${pet.form}</b>` : ''}`;
  $('mood').textContent = pet.dead ? '💀 gone' : pet.sick ? '🤒 sick' : pet.asleep ? '💤 sleeping' : `${pet.needsAttention ? '❗ ' : ''}${pet.mood}`;
  for (const k of ['hunger', 'happiness', 'energy', 'hygiene', 'health']) setBar(k, pet[k]);
  setBar('weight', pet.weight, 99);
  const egg = pet.stage === 'egg';
  $('btn-hatch').hidden = !egg;
  for (const b of document.querySelectorAll('#actions button[data-action]')) {
    const a = b.dataset.action;
    if (a === 'hatch') { b.disabled = !egg; continue; }
    b.disabled = pet.dead || egg || (pet.asleep && (a === 'feed' || a === 'snack' || a === 'play'));
  }
  $('btn-sleep').innerHTML = `<span class="ico">${pet.lightsOff ? '☀️' : '🌙'}</span>${pet.lightsOff ? 'Lights on' : 'Lights off'}`;
  if (document.activeElement !== $('i-name')) $('i-name').value = pet.name;
}
function renderLog(events) {
  $('log').innerHTML = events.map(e => `<li><time>${fmtTime(e.t)}</time><span>${e.msg.replace(/</g, '&lt;')}</span></li>`).join('');
}

// ---- canvas mirroring the device screen ----
const ctx = $('screen').getContext('2d');
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function drawScreen() {
  frame = Math.floor(Date.now() / 500) % 2;  // 2 Hz idle blink, independent of redraw rate
  if (!state || !sheet) return;
  const p = state.pet, t = sheet.species[p.species] || Object.values(sheet.species)[0];
  const night = p.lightsOff, bg = night ? t.night : t.bg, bg2 = night ? t.night2 : t.bg2, fg = night ? '#e8ecff' : '#222433';
  ctx.fillStyle = bg; ctx.fillRect(0, 0, 320, 172);
  const rx = 8, ry = 30, rw = 200, rh = 134, floorY = ry + rh - 22;
  rr(rx, ry, rw, rh, 12, bg2);
  ctx.save(); ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 12); ctx.clip();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(rx, floorY, rw, rh); ctx.restore();
  ctx.fillStyle = fg; ctx.font = 'bold 15px system-ui, sans-serif'; ctx.fillText(p.name, 10, 21);
  // stage pill
  const pill = p.stage === 'egg' ? `egg  ${p.eggSec}s` : `${p.stage}  ${p.ageSec < 3600 ? Math.floor(p.ageSec / 60) + 'm' : Math.floor(p.ageSec / 3600) + 'h'}`;
  ctx.font = '10px ui-monospace, Menlo, monospace'; const pw = ctx.measureText(pill).width + 14;
  rr(320 - 24 - pw, 6, pw, 16, 8, t.accent); ctx.fillStyle = '#1a1a2e'; ctx.fillText(pill, 320 - 24 - pw + 7, 17);
  ctx.fillStyle = connected ? '#4fd27a' : '#ff5c7a'; ctx.beginPath(); ctx.arc(308, 14, 4, 0, 7); ctx.fill();

  const anim = (Date.now() - lastActionAt < 3000) ? lastAction : p.anim !== 'none' ? p.anim : null;
  if (p.anim === 'none' && Date.now() - lastActionAt > 3000) animSeenAt = 0; else if (!animSeenAt) animSeenAt = Date.now();
  const scale = 4, px = rx + (rw - 24 * scale) / 2, py = floorY + 4 - 24 * scale;
  if (p.dead) {
    drawSprite(ctx, 'skull', rx + (rw - 80) / 2, floorY - 86, 5);
    ctx.fillStyle = fg; ctx.font = 'bold 12px system-ui'; ctx.fillText('R.I.P.', rx + 60, ry + 22);
  } else if (p.stage === 'egg') {
    drawSprite(ctx, `${p.species}_egg`, px + (frame ? 2 : -2), py + (p.eggSec > 45 && frame ? -3 : 0), scale);
  } else {
    const alt = frame && !p.asleep ? 1 : 0;
    let dx = (!p.asleep && !anim) ? (frame ? 2 : -2) : 0, dy = anim === 'play' && frame ? -16 : 0;
    rr(px + 20, floorY - 1, 56, 6, 3, 'rgba(0,0,0,.15)');
    const slot = p.stage === 'elder' ? 'adult_elder' : p.stage === 'adult' && p.form !== 'normal' ? `adult_${p.form}` : p.stage;
    drawSprite(ctx, `${p.species}_${slot}_${p.asleep && !anim ? 'sleep' : alt}`, px + dx, py + dy, scale);
    const ex = px + 24 * scale - 14, ey = py - 4;
    if (anim === 'feed' || anim === 'snack' || anim === 'eat') {
      const snack = anim === 'snack' || p.anim === 'snack';
      const list = snack ? sheet.snacks : sheet.meals;
      const item = p.animItem || localItem || (localItem = list[Math.floor(Math.random() * list.length)]);
      const phase = Math.min(2, Math.floor((Date.now() - (lastActionAt || animSeenAt)) / 1000));
      if (phase >= 2) drawSprite(ctx, 'crumbs', rx + 12, floorY - 44, 3);
      else drawSprite(ctx, item, rx + 12, floorY - 44, 3, phase === 0 ? 99 : 9);
    } else localItem = null;
    if (anim === 'pet' || anim === 'medicine' || anim === 'heal') drawSprite(ctx, 'heart', ex, ey + (frame ? 0 : 4), 2);
    if (anim === 'play') { const t = Date.now() % 600, b = (t < 300 ? t : 600 - t) * 40 / 300; drawSprite(ctx, 'ball', rx + 14, floorY - 32 - b, 2); }
    if (anim === 'clean') {
      drawSprite(ctx, 'icon_clean', ex, ey, 2);
      const t = Date.now(), bw = 24 * scale + 24, bh = 24 * scale + 10, bx0 = px - 12, by0 = py - 10;
      for (let i = 0; i < 9; i++) {
        const ph = (t + i * 311) % 1800, r = 2 + (i % 3);
        const bx = bx0 + ((i * 37 + 11) % (bw - 16)) + 8 + (Math.floor(ph / 150) % 3) - 1, by = by0 + bh - 6 - ph * (bh - 10) / 1800;
        ctx.strokeStyle = 'rgba(190,235,255,.95)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.stroke();
        if (r > 2) { ctx.fillStyle = '#fff'; ctx.fillRect(bx - 1.5, by - 1.5, 1.5, 1.5); }
      }
    }
    if (p.asleep && !anim) drawSprite(ctx, 'zzz', ex, ey + (frame ? 0 : 3), 2);
    if (p.sick) drawSprite(ctx, 'sick', rx + 14, py + 10, 2);
    if (!p.asleep && !anim && p.needsAttention && frame) drawSprite(ctx, 'alert', ex, ey, 2);
    for (let i = 0; i < p.poops; i++) drawSprite(ctx, 'poop', rx + rw - 44 - i * 30, floorY - 28, 2);
  }
  // right panel stats
  const rows = [['FOOD', p.hunger], ['FUN', p.happiness], ['ENERGY', p.energy], ['CLEAN', p.hygiene], ['HEALTH', p.health]];
  ctx.font = '9px ui-monospace, Menlo, monospace';
  rows.forEach(([l, v], i) => {
    const x = 218, y = 34 + i * 26, w = 94;
    ctx.fillStyle = night ? '#9aa0c9' : '#6b7090'; ctx.fillText(l, x, y + 7);
    ctx.fillStyle = fg; ctx.textAlign = 'right'; ctx.fillText(v, x + w, y + 7); ctx.textAlign = 'left';
    rr(x, y + 10, w, 7, 3.5, night ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.10)');
    if (v > 0) rr(x, y + 10, Math.max(7, w * v / 100), 7, 3.5, v > 50 ? '#4fd27a' : v > 25 ? '#ffd166' : '#ff5c7a');
  });
}
setInterval(drawScreen, 100);

// ---- species picker ----
const SEASONS = { halloween: { tag: '🎃 Halloween', color: '#ff8c1a' }, cute: { tag: '🎀 Cute', color: '#ff8fb1' } };
function buildPicker() {
  const box = $('species'); box.innerHTML = '';
  for (const [key, t] of Object.entries(sheet.species)) {
    const b = document.createElement('button'); b.dataset.species = key;
    const c = document.createElement('canvas'); c.width = c.height = 72;
    const cx = c.getContext('2d'); cx.fillStyle = t.bg2; cx.beginPath(); cx.roundRect(0, 0, 72, 72, 12); cx.fill();
    drawSprite(cx, `${key}_adult_0`, 0, 0, 3);
    b.append(c, Object.assign(document.createElement('span'), { textContent: `${t.emoji} ${t.label}` }));
    const season = SEASONS[t.season]; if (season) b.append(Object.assign(document.createElement('small'), { className: 'season', textContent: season.tag, style: `background:${season.color}` }));
    box.append(b);
  }
}
$('btn-reset').addEventListener('click', () => $('dlg').showModal());
$('dlg-cancel').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-species]'); if (!b) return;
  $('dlg').close();
  const body = { type: 'reset' }; if (b.dataset.species) body.species = b.dataset.species;
  try { const r = await api('/api/action', body); state.pet = r.pet; render(r.pet); toast('A new egg appeared'); refresh(); } catch { toast('Device did not answer'); }
});

// ---- polling & actions ----
async function refresh() {
  try {
    const [s, e] = await Promise.all([api('/api/state'), api('/api/events')]);
    state = s; render(s.pet); renderLog(e.events);
    if (!connected) { connected = true; $('conn').textContent = `online · ${s.device.ip}`; $('conn').className = 'badge on'; loadInfo(); }
  } catch { connected = false; $('conn').textContent = 'device unreachable'; $('conn').className = 'badge off'; }
}
async function loadInfo() {
  try {
    const i = await api('/api/info');
    $('devinfo').innerHTML = Object.entries({ Board: i.board, Firmware: i.fw, IP: i.ip, WiFi: `${i.ssid} (${i.rssi} dBm)`, mDNS: i.mdns, 'Local time': `${i.localTime}${i.night ? ' · night mode (dimmed)' : ''}`, 'Free heap': `${Math.round(i.freeHeap / 1024)} KB` })
      .map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
    $('i-bl').value = i.brightness; $('v-bl').textContent = i.brightness;
    for (const b of document.querySelectorAll('#seg-orient button')) b.classList.toggle('active', b.dataset.orient === i.orientation);
    if (!tzTouched) selectTz(i.tz);
    if (!$('i-host').value && i.hostname) $('i-host').value = i.hostname;
    $('i-ndim').checked = i.nightDim !== false;
  } catch {}
}
$('actions').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-action]'); if (!b) return;
  const type = b.dataset.action;
  try {
    const r = await api('/api/action', { type });
    if (r.applied) { lastAction = type; lastActionAt = Date.now(); }
    toast(r.applied ? `${b.textContent.trim()} ✓` : `${b.textContent.trim()}: not right now`);
    state.pet = r.pet; render(r.pet); api('/api/events').then(e => renderLog(e.events));
  } catch { toast('Device did not answer'); }
});
$('f-name').addEventListener('submit', async (ev) => { ev.preventDefault(); const r = await api('/api/name', { name: $('i-name').value.trim() }); render(r.pet); toast('Renamed'); });
// Common zones as POSIX TZ strings (what the firmware's clock understands); "Custom" reveals the raw field.
const TZ_ZONES = [
  ['America', [['Mexico City / Monterrey', 'CST6'], ['Cancún', 'EST5'], ['Tijuana', 'PST8PDT,M3.2.0,M11.1.0'], ['Hermosillo', 'MST7'],
    ['US Eastern', 'EST5EDT,M3.2.0,M11.1.0'], ['US Central', 'CST6CDT,M3.2.0,M11.1.0'], ['US Mountain', 'MST7MDT,M3.2.0,M11.1.0'], ['Arizona', 'MST7'],
    ['US Pacific', 'PST8PDT,M3.2.0,M11.1.0'], ['Alaska', 'AKST9AKDT,M3.2.0,M11.1.0'], ['Hawaii', 'HST10'],
    ['Bogotá / Lima / Quito', '<-05>5'], ['Caracas / La Paz', '<-04>4'], ['Santiago', '<-04>4<-03>,M9.1.6/24,M4.1.6/24'],
    ['Buenos Aires / Montevideo', '<-03>3'], ['São Paulo', '<-03>3']]],
  ['Europe', [['London / Dublin', 'GMT0BST,M3.5.0/1,M10.5.0'], ['Lisbon', 'WET0WEST,M3.5.0/1,M10.5.0'],
    ['Madrid / Paris / Berlin / Rome', 'CET-1CEST,M3.5.0,M10.5.0/3'], ['Athens / Helsinki / Kyiv', 'EET-2EEST,M3.5.0/3,M10.5.0/4'],
    ['Istanbul / Moscow', '<+03>-3']]],
  ['Asia & Pacific', [['Dubai', '<+04>-4'], ['India', 'IST-5:30'], ['Bangkok / Jakarta', '<+07>-7'], ['Singapore / Manila / Shanghai', '<+08>-8'],
    ['Tokyo / Seoul', 'JST-9'], ['Sydney / Melbourne', 'AEST-10AEDT,M10.1.0,M4.1.0/3'], ['Brisbane', 'AEST-10'], ['Auckland', 'NZST-12NZDT,M9.5.0,M4.1.0/3']]],
  ['Other', [['UTC', 'UTC0']]],
];
let tzTouched = false;
(() => {
  const sel = $('s-tz');
  for (const [group, zones] of TZ_ZONES) {
    const og = document.createElement('optgroup'); og.label = group;
    for (const [label, tz] of zones) { const o = document.createElement('option'); o.value = tz; o.textContent = label; og.appendChild(o); }
    sel.appendChild(og);
  }
  const custom = document.createElement('option'); custom.value = ''; custom.textContent = 'Custom POSIX string…'; sel.appendChild(custom);
  sel.addEventListener('change', () => { tzTouched = true; $('i-tz').hidden = sel.value !== ''; if (!sel.value) $('i-tz').focus(); });
  $('i-tz').addEventListener('input', () => { tzTouched = true; });
})();
function selectTz(tz) {
  const sel = $('s-tz');
  const known = [...sel.options].some(o => o.value === tz && o.value !== '');
  sel.value = known ? tz : '';
  $('i-tz').hidden = known;
  $('i-tz').value = tz || '';
}
$('f-tz').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const tz = ($('s-tz').value || $('i-tz').value).trim();
  if (!tz) { toast('Type a POSIX TZ string'); return; }
  await api('/api/settings', { tz }); tzTouched = false; toast('Time zone saved');
});
$('i-ndim').addEventListener('change', async (ev) => { await api('/api/settings', { nightDim: ev.target.checked }); toast(ev.target.checked ? 'Night dimming on' : 'Night dimming off'); });
$('f-host').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const hostname = $('i-host').value.trim().toLowerCase();
  try {
    const r = await api('/api/settings', { hostname });
    toast(r.rebooting ? `Rebooting as ${hostname}.local…` : 'Hostname unchanged');
  } catch (e) { toast(e.message || 'Invalid hostname'); }
});
let blTimer = null;
$('i-bl').addEventListener('input', (ev) => {
  $('v-bl').textContent = ev.target.value;
  clearTimeout(blTimer);  // live preview while dragging, throttled
  blTimer = setTimeout(() => api('/api/settings', { brightness: +ev.target.value }).catch(() => {}), 120);
});
$('i-bl').addEventListener('change', async (ev) => { clearTimeout(blTimer); await api('/api/settings', { brightness: +ev.target.value }); toast(`Brightness ${ev.target.value}`); });
$('seg-orient').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-orient]'); if (!b || b.classList.contains('active')) return;
  if (!confirm(`Switch the screen to ${b.textContent.trim()}? The device reboots to apply it.`)) return;
  try { await api('/api/settings', { orientation: b.dataset.orient }); toast('Rebooting with the new orientation…'); } catch { toast('Device did not answer'); }
  for (const x of document.querySelectorAll('#seg-orient button')) x.classList.toggle('active', x === b);
});
$('f-wifi').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  if (!confirm('Save WiFi credentials and reboot the device?')) return;
  try { await fetch(API + '/api/wifi', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ssid: $('i-ssid').value, pass: $('i-pass').value }) }); } catch {}
  toast('Rebooting… reconnect to the new network');
});

fetch(API + '/sprites.json').then(r => r.json()).then(j => { sheet = j; buildPicker(); if (state) { themed = ''; render(state.pet); } });
refresh();
setInterval(refresh, 2000);
</script>
</body>
